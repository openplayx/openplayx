name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Unit Tests
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: openplayx

    steps:
      - name: Checkout openplayx
        uses: actions/checkout@v4
        with:
          path: openplayx
          fetch-depth: 0

      - name: Checkout package-libvlc
        uses: actions/checkout@v4
        with:
          repository: openplayx/package-libvlc
          path: package-libvlc
          token: ${{ secrets.OPENPLAYX_DEPS_TOKEN || github.token }}

      - name: Checkout package-ffmpeg
        uses: actions/checkout@v4
        with:
          repository: openplayx/package-ffmpeg
          path: ffmpeg-package
          token: ${{ secrets.OPENPLAYX_DEPS_TOKEN || github.token }}

      - name: Checkout package-media
        uses: actions/checkout@v4
        with:
          repository: openplayx/package-media
          path: package-media
          token: ${{ secrets.OPENPLAYX_DEPS_TOKEN || github.token }}

      - name: Checkout package-whisper
        uses: actions/checkout@v4
        with:
          repository: openplayx/package-whisper
          path: package-whisper
          token: ${{ secrets.OPENPLAYX_DEPS_TOKEN || github.token }}

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: SonarQube Cloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        with:
          projectBaseDir: openplayx

  webos:
    name: Package experimental webOS TV client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webOS CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/webos-tools" @webos-tools/cli@3.2.6 --no-audit --no-fund
          echo "$RUNNER_TEMP/webos-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check launcher and package
        run: |
          node --check webos/launcher.js
          bash -n tool/build_webos.sh
          ./tool/build_webos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openplayx-webos-experimental
          path: build/webos/*.ipk
          if-no-files-found: error

  tizen:
    name: Prepare experimental Samsung Tizen client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare widget sources (sign locally with a Samsung profile)
        run: |
          python3 tool/build_tizen.py --prepare-only
          node --check build/tizen/widget/launcher.js
          node --check build/tizen/widget/client-config.js
          node --check build/tizen/widget/app.js
          node --check build/tizen/widget/tv.js
      - uses: actions/upload-artifact@v4
        with:
          name: openplayx-tizen-unsigned-sources
          path: build/tizen/OpenPlayX-tizen-unsigned.zip
          if-no-files-found: error
